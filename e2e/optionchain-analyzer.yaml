# The option chain tool in analyzer (sandbox) mode against the mock server (CI job e2e-android):
# the at-the-money call shows with no scroll, its leg sheet shows BUY and SELL with no scroll,
# BUY reviews the ticket as ANALYZE and places the order, and back on the chain a swipe up on
# the ladder leaves the expiry chips in view (only the ladder scrolls) (ux-bar T16-03, OC-1).
# Needs the mock started with PORT=5000 WS_PORT=8765 and reset before the flow. The CI phone
# pass runs it again at 360 dp, dark, font 1.3 (T16-02); screenshots go to e2e-debug.
appId: in.openalgo.mobile
---
- launchApp:
    clearState: true
# Analyzer mode before onboarding, so the first mode the app reads is ANALYZE.
- runScript:
    file: scripts/mock.js
    env:
      CONTROL: '{"analyzer":true}'
- runFlow: onboarding-live.yaml

- tapOn: "Tools"
- scrollUntilVisible:
    element:
      id: tool-tile-OPTIONCHAIN
    direction: DOWN
    timeout: 10000
- tapOn:
    id: tool-tile-OPTIONCHAIN
- extendedWaitUntil:
    visible:
      id: oc-ce-ATM
    timeout: 20000
- takeScreenshot: optionchain
- tapOn:
    id: oc-ce-ATM
# both sides of the leg sheet, with no scroll
- assertVisible:
    id: oc-leg-buy
- assertVisible:
    id: oc-leg-sell
- takeScreenshot: oc-leg
- tapOn:
    id: oc-leg-buy
- assertVisible:
    id: ticket-screen
- tapOn:
    id: ticket-review
- assertVisible:
    id: review-mode-badge
    text: ANALYZE
# Confirm stays disabled until the review has read the mode and the order book
- tapOn:
    id: ticket-confirm
    enabled: true
- extendedWaitUntil:
    visible: "Order placed"
    timeout: 15000
- tapOn:
    id: ticket-done
- assertVisible:
    id: oc-screen
# only the ladder scrolls: the expiry chips stay in view
- swipe:
    from:
      id: oc-ladder
    direction: UP
- assertVisible:
    id: oc-expiry-0
- takeScreenshot: optionchain-scrolled
