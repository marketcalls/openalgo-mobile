name: Android build
description: Prebuild the Android project and assemble a release APK (debug-key signed).
inputs:
  abis:
    description: Comma-separated ABIs to build
    required: false
    default: arm64-v8a,armeabi-v7a
  artifact:
    description: Name of the uploaded artifact
    required: true
runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: "17"
        cache: gradle
        cache-dependency-path: package-lock.json

    - name: Generate the Android project
      shell: bash
      run: npx expo prebuild --platform android --no-install

    - name: Build release APK
      shell: bash
      working-directory: android
      # Signed with the React Native template's debug key: sideload only.
      run: ./gradlew assembleRelease -PreactNativeArchitectures=${{ inputs.abis }} --no-daemon

    - name: Rename APK
      shell: bash
      run: |
        VERSION=$(node -p "require('./package.json').version")
        mkdir -p dist
        cp android/app/build/outputs/apk/release/app-release.apk \
           "dist/openalgo-${VERSION}-b${BUILD_NUMBER}-${GITHUB_SHA::7}.apk"

    - name: Upload APK
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact }}
        path: dist/*.apk
        if-no-files-found: error
        retention-days: 30
