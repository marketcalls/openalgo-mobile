# Quality gates and builds for the app at the repo root.
# Golden regeneration is added in M4 and TestFlight in M6.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the pinned openalgo commit
        id: ref
        run: echo "sha=$(tr -d '[:space:]' < openalgo.ref)" >> "$GITHUB_OUTPUT"

      - name: Check out openalgo (frontend source only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: marketcalls/openalgo
          ref: ${{ steps.ref.outputs.sha }}
          path: openalgo
          sparse-checkout: frontend/src
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx jest --ci

      - name: Script tests
        run: npm run test:scripts

      - name: Compat tests
        run: npm run test:compat

      - name: Import boundaries
        run: npm run boundaries

      - name: Theme tokens match the web
        run: OPENALGO_DIR=$GITHUB_WORKSPACE/openalgo npm run tokens:check

      - name: Expo dependency versions
        run: npx expo install --check

      - name: Expo doctor
        run: npx expo-doctor

      - name: Export bundles
        run: npm run export

      - name: Bundle budgets
        run: npm run bundles

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tgz

      - name: Secret scan (git history)
        run: gitleaks git --redact .

      - name: Secret scan (exported bundles)
        run: gitleaks dir --redact --config .gitleaks.toml dist-export

      - name: Key scan (exported bundles)
        # gitleaks' key rule needs "apikey" and a separator; Hermes stores strings back to back.
        run: node scripts/check-bundle-keys.mjs dist-export

  android:
    name: Android APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        # NDK, Gradle caches and two ABIs of native builds need roughly 10 GB.
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build APK
        uses: ./.github/actions/android-build
        env:
          # A composite action cannot read secrets; pull requests from forks get none.
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        with:
          artifact: android-apk
          has-keystore: ${{ env.HAS_KEYSTORE }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

  ios-simulator:
    name: iOS Simulator app
    needs: checks
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build simulator app
        uses: ./.github/actions/ios-build
        with:
          sdk: iphonesimulator
          destination: generic/platform=iOS Simulator
          artifact: ios-simulator-app

  ios-device:
    name: iOS IPA (unsigned)
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned IPA
        uses: ./.github/actions/ios-build
        with:
          sdk: iphoneos
          destination: generic/platform=iOS
          artifact: ios-ipa-unsigned

  e2e-android:
    name: Android e2e (${{ matrix.PROFILE }})
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        PROFILE: ["2.0.0.0", "2.0.3.5"]
    env:
      PROFILE: ${{ matrix.PROFILE }}
      MAESTRO_VERSION: 2.12.1
      MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build APK (x86_64)
        uses: ./.github/actions/android-build
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        with:
          abis: x86_64
          artifact: android-apk-e2e-${{ matrix.PROFILE }}
          has-keystore: ${{ env.HAS_KEYSTORE }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Install Maestro
        run: |
          curl -sSfL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | sha256sum -c -
          unzip -q maestro.zip -d "$RUNNER_TEMP"
          rm maestro.zip
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write the e2e script
        # android-emulator-runner runs a multi-line script one line at a time, so the steps
        # that share shell state (the mock's restart) live in one file.
        run: |
          cat > "$RUNNER_TEMP/e2e.sh" <<'SCRIPT'
          set -euo pipefail
          start_mock() {
            PORT=5000 WS_PORT="$1" PROFILE="$PROFILE" node dev/mock-server/main.mjs > "$RUNNER_TEMP/mock.log" 2>&1 &
            MOCK_PID=$!
            for _ in $(seq 1 50); do
              grep -q '^MOCK_READY' "$RUNNER_TEMP/mock.log" && return 0
              sleep 0.2
            done
            cat "$RUNNER_TEMP/mock.log"
            return 1
          }
          APK=$(ls dist/*.apk | head -n 1)
          adb install -r "$APK"
          start_mock 8765
          maestro test e2e/onboarding-live.yaml
          kill "$MOCK_PID"
          wait "$MOCK_PID" || true
          start_mock off
          adb shell pm clear in.openalgo.mobile
          maestro test e2e/onboarding-polling.yaml
          kill "$MOCK_PID"
          SCRIPT

      - name: Run the flows in an emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash ${{ runner.temp }}/e2e.sh

      - name: Mock server log
        if: failure()
        run: cat "$RUNNER_TEMP/mock.log" || true
